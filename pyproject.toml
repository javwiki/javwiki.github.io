[project]
name = "javwiki-tools"
version = "0.1.0"
description = "Build and maintenance tooling for the JAV Wiki static site"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pyyaml==6.0.3",
    "zensical==0.0.62",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.9,<1",
]
scraper = [
    "playwright>=1.40,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
# The validator intentionally matches full-width Japanese/Chinese punctuation.
"scripts/check_i18n.py" = ["RUF001"]
