services:
  japan-vpn:
    build: .
    image: javwiki/japan-vpn:local
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:7890:7890/tcp"
      - "127.0.0.1:9090:9090/tcp"
    volumes:
      - state:/data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    stop_grace_period: 15s

volumes:
  state:
