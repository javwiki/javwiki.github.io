[project]
site_name = "JAV百科事典"
site_url = "https://javwiki.github.io/ja/"
site_description = "JAV（日本のアダルトビデオ）総合百科事典。"
site_author = "javwiki contributors"
repo_url = "https://github.com/javwiki/javwiki.github.io"
repo_name = "javwiki/javwiki.github.io"
edit_uri = "edit/main/docs/ja/"
docs_dir = "docs/ja"
site_dir = "site/ja"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "中文", link = "/", lang = "zh" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "English", link = "/en/", lang = "en" },
]

[project.theme]
variant = "classic"
language = "ja"
custom_dir = "overrides"
features = [
  "navigation.instant",
  "navigation.prune",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "ライトモードに切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替える"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "システム設定に従う"

[project.plugins.tags]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
