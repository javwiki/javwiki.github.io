[project]
site_name = "JAV 百科"
site_url = "https://javwiki.github.io/"
site_description = "JAV（日本成人视频）综合百科。"
site_author = "javwiki contributors"
repo_url = "https://github.com/javwiki/javwiki.github.io"
repo_name = "javwiki/javwiki.github.io"
edit_uri = "edit/main/docs/zh/"
docs_dir = "docs/zh"
site_dir = "site"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "中文", link = "/", lang = "zh" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "English", link = "/en/", lang = "en" },
]

[project.theme]
variant = "classic"
language = "zh"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

# Follow the user's system color preference by default.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "切换到浅色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "切换到深色模式"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "跟随系统设置"

[project.plugins.tags]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
