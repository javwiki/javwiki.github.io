[project]
site_name = "JAV Encyclopedia"
site_url = "https://javwiki.github.io/en/"
site_description = "A comprehensive encyclopedia of Japanese adult video."
site_author = "javwiki contributors"
repo_url = "https://github.com/javwiki/javwiki.github.io"
repo_name = "javwiki/javwiki.github.io"
edit_uri = "edit/main/docs/en/"
docs_dir = "docs/en"
site_dir = "site/en"
use_directory_urls = true

[project.extra]
alternate = [
  { name = "中文", link = "/", lang = "zh" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "English", link = "/en/", lang = "en" },
]

[project.theme]
variant = "classic"
language = "en"
features = [
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Follow system preference"

[project.plugins.tags]

[project.markdown_extensions]
attr_list = {}
md_in_html = {}
toc.permalink = true
